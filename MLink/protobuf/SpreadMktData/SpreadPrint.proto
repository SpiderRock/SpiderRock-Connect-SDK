syntax = "proto3";

import "spiderrock_common.proto";


package spiderrock.protobuf;

import "google/protobuf/timestamp.proto";

    
message SpreadPrint {
    message PKey {
        
        ContentKey spread_iD = 10; // the content key (SPREAD_CONTENT_KEY.md): SpreadId tag + 15 bytes of the leg-set hash
    }


    MessageMetadata _meta = 1;
    
    PKey pkey = 2;
    TickerKey ticker = 100; // common spread underlier
    BuySell side = 103;
    int32 prt_size = 106;
    double prt_price = 109;
    OptExch prt_exch = 112;
    int64 src_timestamp = 115; // source high precision timestamp (if available)
    int64 net_timestamp = 118; // PTP timestamp
    google.protobuf.Timestamp timestamp = 121;
    SpreadScope scope_flags = 123; // what the leg set spans; MultiTicker = cross-complex
}


