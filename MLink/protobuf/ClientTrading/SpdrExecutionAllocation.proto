syntax = "proto3";

import "spiderrock_common.proto";


package spiderrock.protobuf;

import "google/protobuf/timestamp.proto";

    
message SpdrExecutionAllocation {
    message PKey {
        
        int64 fill_number = 10; // fillNumber of the SpdrParentExecution being allocated
    }

    message Fragments {
        
        string frag_accnt = 139; // target SR alloc accnt
        string frag_cFirm = 160; // SR client firm
        int32 alloc_size = 142; // shares of this fill assigned to the fragment
    }


    MessageMetadata _meta = 1;
    
    PKey pkey = 2;
    int64 base_parent_number = 100; // parent order of the allocated execution (always filled; manual/away executions get minted parents)
    string omni_accnt = 103; // omnibus accnt (SR accnt)
    string omni_cFirm = 152; // SR client firm
    OptionKey sec_key = 106; // security key (stock, future, or option)
    SpdrKeyType sec_type = 109; // security type
    string mleg_leg_key = 112; // [secKey.StringKey;legRatio;side;positionEffect, secKey.StringKey;legRatio;side;positionEffect, ...]
    BuySell order_side = 115; // order side (always buy for MLEG orders)
    int64 cl_ord_id = 163; // child order this fill belongs to (one-hop join to the child's SpdrAllocationNotice)
    AllocationRule allocation_rule = 124;
    AllocStatus alloc_status = 154;
    string alloc_detail = 157;
    AllocDeliveryStatus delivery_status = 166; // downstream delivery rollup back-propagated from the child's SpdrAllocationNoticeStatus (3700); distinct from allocStatus, which is internal emission state
    string modified_by = 145; // user who last modified this record
    SysEnvironment modified_in = 148;
    google.protobuf.Timestamp timestamp = 151; // timestamp of last modification
    repeated Fragments fragments = 136;
}


