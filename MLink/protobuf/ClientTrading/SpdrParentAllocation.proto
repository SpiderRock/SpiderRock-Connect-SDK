syntax = "proto3";

import "spiderrock_common.proto";


package spiderrock.protobuf;

import "google/protobuf/timestamp.proto";

    
message SpdrParentAllocation {
    message PKey {
        
        int64 base_parent_number = 10;
    }

    message Fragments {
        
        string frag_accnt = 136; // target SR alloc accnt
        string frag_cFirm = 153; // SR client firm
        float alloc_fraction = 139; // target alloc size (if parent order 100% fills)
        int32 alloc_size = 142; // target alloc size (assuming parent order 100% fills)
    }


    MessageMetadata _meta = 1;
    
    PKey pkey = 2;
    string omni_accnt = 100; // omnibus accnt (SR accnt)
    string omni_cFirm = 152; // SR client firm
    OptionKey sec_key = 103; // security key (stock, future, or option)
    SpdrKeyType sec_type = 106; // security type
    string mleg_leg_key = 109; // [secKey.StringKey;legRatio;side;positionEffect, secKey.StringKey;legRatio;side;positionEffect, ...]
    BuySell order_side = 112; // order side (always buy for MLEG orders)
    ShortSaleFlag ssale_flag = 115; // ssale flag (None if not stock)
    PositionType position_type = 118; // positionType (None if not equity option)
    SpdrSource spdr_source = 121; // parent order source
    int64 grouping_code = 124; // unique broker code
    AllocationRule allocation_rule = 127; // fragment sizing: Hamilton (largest remainder; default, deterministic) or LargestWins; explicit sizes via Fragments.allocSize
    YesNo transfers_effected = 154; // Yes = the publisher already published the In/Out execution pairs (ATS block cross: the EE pairs them so client exec reports flow before allocation); the AllocationServer then records/reports only and emits NO pairs
    AllocSource alloc_source = 157; // provenance: Client = submitted directly (API publish); Manual = posted by a person via the SPARC write path; RiskGroup/AccntExchGroup = materialized by the AllocationServer from a standing instruction; BlockCross = published by the EE for an ATS cross (None = legacy client submission)
    int64 source_risk_group_id = 160; // when allocSource=RiskGroup: the SpdrRiskGroupAllocation basket this instruction was materialized from (zero otherwise)
    string modified_by = 145; // user who last modified this record
    SysEnvironment modified_in = 148;
    google.protobuf.Timestamp timestamp = 151; // timestamp of last modification
    repeated Fragments fragments = 133;
}


