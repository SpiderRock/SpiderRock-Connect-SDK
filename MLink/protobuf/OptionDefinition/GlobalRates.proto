syntax = "proto3";

import "spiderrock_common.proto";


package spiderrock.protobuf;

import "google/protobuf/timestamp.proto";

/*
    The daily rate curves per source, written by the SRGlobalRates publisher once a session. Readers resolve a curve
    by key (RateCurveDefinitionV3 9263) and price on LiveRateCurve (1130) and RateCurveClose (1132); this record is
    the fallback for a key with no live curve. Retires when the rate server projects it from the curve records.
*/    
message GlobalRates {
    message PKey {
        
        RateSource rate_source = 10;
    }

    message Curve {
        
        int32 days = 106; // calendar days to expiration (actual/365 days per year)
        float rate = 109;
    }


    MessageMetadata _meta = 1;
    
    PKey pkey = 2;
    google.protobuf.Timestamp timestamp = 100;
    string currency = 112; // ISO 4217 - the currency this rate is in, set by the publisher from its own configuration
    string rate_label = 115; // display name of the curve, set by the publisher from its own configuration; title case, family word last (SPX Box, SOFR, USD OIS); the same label for every producer of one rateSource
    repeated Curve curve = 103;
}


